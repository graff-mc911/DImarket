name: Apply directory contact backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/directory/fix-incomplete-directory-profiles.sql"
      - "scripts/apply-directory-contact-backfill.mjs"
      - ".github/workflows/apply-directory-contact-backfill.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Apply published phones / company reclassify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::No SUPABASE_ACCESS_TOKEN or SUPABASE_SERVICE_ROLE_KEY — skip DB backfill. Paste data/directory/fix-incomplete-directory-profiles.sql in the Supabase SQL Editor."
            exit 0
          fi
          node scripts/apply-directory-contact-backfill.mjs
