name: Apply directory contact backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/directory/fix-incomplete-directory-profiles.sql"
      - "scripts/apply-directory-contact-backfill.mjs"
      - ".github/workflows/apply-directory-contact-backfill.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Apply published phones / company reclassify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          node scripts/apply-directory-contact-backfill.mjs
