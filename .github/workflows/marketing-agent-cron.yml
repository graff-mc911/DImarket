name: Marketing Agent Cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke marketing-agent cron_run
        env:
          CRON_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "MARKETING_CRON_SECRET not set in GitHub repo secrets — skip"
            exit 0
          fi
          curl -sf -X POST \
            "https://wjlfvajloxkevggwjgtk.supabase.co/functions/v1/marketing-agent" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"action":"cron_run"}'
