name: CI Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build (app)
        run: npm run build:app
      - name: Typecheck (non-blocking until Supabase types are synced)
        continue-on-error: true
        run: npm run typecheck
      - name: Registration role logic smoke
        run: node scripts/verify-registration-logic.mjs
      - name: Commercial agents matching smoke
        run: npm run test:commercial-agents

  e2e-prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke against production
        env:
          PLAYWRIGHT_BASE_URL: https://dimarket.app
        run: npx playwright test e2e/smoke.spec.ts e2e/cost-estimator.spec.ts e2e/home-map-chrome.spec.ts e2e/header-responsive.spec.ts --project=chromium
