name: CI Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build (app)
        run: npm run build:app
      - name: Registration role logic smoke
        run: node scripts/verify-registration-logic.mjs
