name: Apply Owner Profile Moderation Schema

# SCHEMA + RPC only. Does NOT run QA hide UPDATE.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/APPLY_OWNER_PROFILE_MODERATION_SCHEMA_ONLY.sql"
      - "scripts/apply-owner-profile-moderation-schema.mjs"
      - "scripts/verify-owner-profile-moderation-rpcs.mjs"
      - ".github/workflows/apply-owner-profile-moderation-schema.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Apply schema/RPC only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          node scripts/apply-owner-profile-moderation-schema.mjs

      - name: Verify Owner RPCs (no hide/delete)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/verify-owner-profile-moderation-rpcs.mjs
