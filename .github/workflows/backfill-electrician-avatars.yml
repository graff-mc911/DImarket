name: Backfill electrician avatars

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/directory/spain-electricians-avatars-backfill.sql"
      - "scripts/apply-electrician-avatars.mjs"
      - "supabase/migrations/20260804150000_backfill_directory_electrician_avatars.sql"
      - ".github/workflows/backfill-electrician-avatars.yml"

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Apply avatar SQL via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN missing — skip SQL"
            exit 0
          fi
          apply_sql() {
            local file="$1"
            echo "Applying $file"
            SQL=$(jq -Rs . < "$file")
            RESP=$(curl -sS -w "\n%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/wjlfvajloxkevggwjgtk/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"query\": ${SQL}}")
            CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP $CODE"
            echo "$BODY" | head -c 800
            echo
            test "$CODE" = "200" -o "$CODE" = "201"
          }
          apply_sql supabase/migrations/20260804150000_backfill_directory_electrician_avatars.sql
          apply_sql data/directory/spain-electricians-avatars-backfill.sql

      - name: Apply via service role / RPC
        env:
          VITE_SUPABASE_URL: https://wjlfvajloxkevggwjgtk.supabase.co
          SUPABASE_URL: https://wjlfvajloxkevggwjgtk.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            JS=$(curl -sL https://dimarket.app/ | grep -oE '/assets/index-[^"]+\.js' | head -1)
            BUNDLE=$(curl -sL "https://dimarket.app$JS")
            export VITE_SUPABASE_ANON_KEY=$(printf '%s' "$BUNDLE" | grep -oE 'eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+' | head -1)
            export SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY"
          fi
          node scripts/apply-electrician-avatars.mjs
          code=$?
          if [ $code -eq 2 ]; then
            echo "No DB credentials in repo secrets yet — UI avatar map remains active."
            exit 0
          fi
          exit $code
