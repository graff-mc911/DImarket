name: Apply Commercial Agents schema

# Applies Phase 1 Commercial Agents tables + grants, then seeds demo rows and verifies REST.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260810180000_commercial_agents.sql"
      - "supabase/migrations/20260811120000_commercial_agents_grants.sql"
      - "scripts/apply-commercial-agents-migration.mjs"
      - "scripts/seed-commercial-agents-demo.mjs"
      - "scripts/verify-commercial-agents-prod.mjs"
      - ".github/workflows/apply-commercial-agents.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Apply Commercial Agents SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret missing"
            exit 1
          fi
          node scripts/apply-commercial-agents-migration.mjs

      - name: Seed demo manufacturer / agent / opportunity
        env:
          VITE_SUPABASE_URL: https://wjlfvajloxkevggwjgtk.supabase.co
          SUPABASE_URL: https://wjlfvajloxkevggwjgtk.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY missing — skip demo seed"
            exit 0
          fi
          node scripts/seed-commercial-agents-demo.mjs

      - name: Verify prod REST tables
        env:
          VITE_SUPABASE_URL: https://wjlfvajloxkevggwjgtk.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/verify-commercial-agents-prod.mjs
