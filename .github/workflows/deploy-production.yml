name: Deploy Production (Vercel)

# Fallback when Vercel Git auto-deploy is stuck.
# Immediate fix without this workflow: Vercel Dashboard → Redeploy production from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check Vercel secrets
        id: check_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::warning::Missing GitHub Actions secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::warning::Skipping workflow deploy — secrets missing. Rely on Vercel Git auto-deploy or Redeploy from dashboard (main)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull production env
        id: pull
        if: steps.check_secrets.outputs.skip != 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Skip workflow deploy when Vercel project link fails
        if: steps.check_secrets.outputs.skip != 'true' && steps.pull.outcome != 'success'
        run: |
          echo "::warning::vercel pull could not load project settings. Rely on Vercel Git auto-deploy (dimarket.app/build-id.txt)."

      - name: Build (production)
        if: steps.check_secrets.outputs.skip != 'true' && steps.pull.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        if: steps.check_secrets.outputs.skip != 'true' && steps.pull.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify live build-id
        if: steps.check_secrets.outputs.skip != 'true' && steps.pull.outcome == 'success'
        run: |
          sleep 5
          live="$(curl -fsS 'https://dimarket.app/build-id.txt' | tr -d '[:space:]')"
          echo "Live build-id: $live"
          echo "Expected prefix of: ${{ github.sha }}"
          case "$live" in
            ${GITHUB_SHA:0:7}*) echo "OK: production updated" ;;
            *) echo "::warning::Production build-id ($live) does not match this SHA yet — CDN may still be catching up." ;;
          esac
