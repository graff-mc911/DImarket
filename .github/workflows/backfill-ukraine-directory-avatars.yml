name: Backfill Ukraine directory avatars

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/directory/ukraine-directory-avatars-backfill.sql"
      - "scripts/generate-ukraine-directory-avatars.mjs"
      - "supabase/migrations/20260805110000_backfill_ukraine_directory_avatars.sql"
      - ".github/workflows/backfill-ukraine-directory-avatars.yml"

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply Ukraine avatar SQL via Management API / RPC
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set +e
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN missing — UI avatar map remains active."
            exit 0
          fi
          apply_sql() {
            local file="$1"
            echo "Applying $file"
            SQL=$(jq -Rs . < "$file")
            RESP=$(curl -sS -w "\n%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/wjlfvajloxkevggwjgtk/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"query\": ${SQL}}")
            CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')
            echo "HTTP $CODE"
            echo "$BODY" | head -c 800
            echo
            test "$CODE" = "200" -o "$CODE" = "201"
          }
          apply_sql supabase/migrations/20260805110000_backfill_ukraine_directory_avatars.sql
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            JS=$(curl -sL https://dimarket.app/ | grep -oE '/assets/index-[^"]+\.js' | head -1)
            BUNDLE=$(curl -sL "https://dimarket.app$JS")
            export VITE_SUPABASE_ANON_KEY=$(printf '%s' "$BUNDLE" | grep -oE 'eyJ[a-zA-Z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | head -1)
          fi
          curl -sS -X POST \
            "https://wjlfvajloxkevggwjgtk.supabase.co/rest/v1/rpc/backfill_ukraine_directory_avatars" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${VITE_SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
