<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons — master DImarket app icon (?v=8 cache bust) -->
    <link rel="icon" href="/favicon.ico?v=8" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8" />

    <!-- Apple -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg?v=8" color="#F5A623" />

    <!-- Android / PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png?v=8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png?v=8" />
    <link rel="manifest" href="/manifest.webmanifest?v=12" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS 26 ignores theme-color and tints PWA chrome from body background. -->
    <meta name="theme-color" content="#232f3e" />
    <meta name="theme-color" content="#232f3e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#232f3e" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#232f3e" />
    <meta name="msapplication-TileImage" content="/mstile-150x150.png?v=8" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque. black-translucent + light body = white frost over the header. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="DImarket" />
    <meta name="application-name" content="DImarket" />

    <!-- SEO Meta Tags -->
    <title>DImarket - Маркетплейс для будівництва, ремонту та матеріалів</title>
    <meta name="description" content="Знайдіть перевірених фахівців з будівництва та якісні матеріали. Ваш маркетплейс для будівництва, ремонту та послуг." />
    <meta name="keywords" content="будівництво, ремонт, послуги, підрядники, будівельники, майстри, сантехніка, електрика, матеріали" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dimarket.app/" />
    <meta property="og:title" content="DImarket - Маркетплейс для будівництва та ремонту" />
    <meta property="og:description" content="Зв'яжіться з перевіреними фахівцями та знайдіть якісні матеріали. Розміщуйте запити без реєстрації." />
    <meta property="og:image" content="https://dimarket.app/og-image.png?v=8" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dimarket.app/" />
    <meta name="twitter:title" content="DImarket - Маркетплейс для будівництва та ремонту" />
    <meta name="twitter:description" content="Зв'яжіться з перевіреними фахівцями та знайдіть якісні матеріали." />
    <meta name="twitter:image" content="https://dimarket.app/twitter-card.png?v=8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Bodoni:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Additional SEO -->
    <link rel="canonical" href="https://dimarket.app/" />
    <meta name="author" content="DImarket" />
    <meta name="robots" content="index, follow" />
    <style>
      /* First paint + iOS 26 PWA: status-bar tint comes from body, not theme-color. */
      html, body { background-color: #232f3e; }
    </style>
    <script>
      (function () {
        var standalone =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          (window.navigator && window.navigator.standalone)
        if (standalone) document.documentElement.classList.add('pwa-standalone')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
