# DImarket — локальна конфігурація Supabase CLI
# Документація: https://supabase.com/docs/guides/cli/config

# Production project ref: wjlfvajloxkevggwjgtk (legacy: qwvbbvipqmmrpmyysczh)
project_id = "wjlfvajloxkevggwjgtk"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://dimarket.market", "https://www.dimarket.market"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.create-checkout-session]
verify_jwt = true

[functions.verify-checkout-session]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
