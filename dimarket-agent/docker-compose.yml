services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - marketing_redis:/data

  marketing-agent:
    build: .
    env_file: .env
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

volumes:
  marketing_redis:
